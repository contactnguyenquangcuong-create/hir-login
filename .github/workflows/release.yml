name: Release

# Push a tag like v0.1.2 to build signed macOS + Windows installers on
# their real OS (native runners, so no makensis/xwin cross-compile
# workarounds are needed) and publish them to the Supabase "releases"
# bucket that the app's auto-updater checks (see src-tauri/tauri.conf.json).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A draft, not a public release — the built-in updater points at
          # Supabase Storage (uploaded below), not this GitHub release.
          # Kept only so tauri-action has somewhere to stash build artifacts.
          tagName: ${{ github.ref_name }}
          releaseName: "Hir-Login ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: false

      - name: Upload macOS updater artifact to Supabase Storage
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://myyqyillsgizshrvoncs.supabase.co/storage/v1/object/releases"
          BUNDLE="src-tauri/target/release/bundle/macos/Hir-Login.app.tar.gz"
          curl -sf -X POST "$BASE/Hir-Login_${VERSION}_aarch64.app.tar.gz" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
            --data-binary "@$BUNDLE"
          curl -sf -X POST "$BASE/Hir-Login_${VERSION}_aarch64.app.tar.gz.sig" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
            --data-binary "@$BUNDLE.sig"

      - name: Upload Windows updater artifact to Supabase Storage
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://myyqyillsgizshrvoncs.supabase.co/storage/v1/object/releases"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          curl -sf -X POST "$BASE/Hir-Login_${VERSION}_x64-setup.exe" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
            --data-binary "@$SETUP"
          curl -sf -X POST "$BASE/Hir-Login_${VERSION}_x64-setup.exe.sig" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
            --data-binary "@$SETUP.sig"

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and upload latest.json
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLIC="https://myyqyillsgizshrvoncs.supabase.co/storage/v1/object/public/releases"
          WRITE="https://myyqyillsgizshrvoncs.supabase.co/storage/v1/object/releases"
          MAC_SIG=$(curl -sf "$PUBLIC/Hir-Login_${VERSION}_aarch64.app.tar.gz.sig")
          WIN_SIG=$(curl -sf "$PUBLIC/Hir-Login_${VERSION}_x64-setup.exe.sig")
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Hir-Login $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "$MAC_SIG", "url": "$PUBLIC/Hir-Login_${VERSION}_aarch64.app.tar.gz" },
              "windows-x86_64": { "signature": "$WIN_SIG", "url": "$PUBLIC/Hir-Login_${VERSION}_x64-setup.exe" }
            }
          }
          EOF
          curl -sf -X POST "$WRITE/latest.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
            -H "Content-Type: application/json" --data-binary @latest.json
