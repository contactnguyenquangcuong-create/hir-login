name: Release Mac

# The Mac build only. scripts/phat-hanh/windows.mjs releases Windows from the owner's PC and tags
# the version locally; once the owner has checked it, scripts/phat-hanh/mac.mjs pushes the tag —
# and that push starts this. Publishes to the Mac channel of the Cloudflare Worker
# `hirlogin-cap-nhat` (Windows has its own channel there), with the Windows release's notes.
# Can also be started by hand (Actions → Release Mac → Run workflow) for a tag already pushed.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           content of D:\AI\HirLogin-goi\hir-login.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  "password" from D:\AI\HirLogin-goi\ky.json
#   HIRLOGIN_UPLOAD_KEY                 "uploadKey" from D:\AI\HirLogin-goi\cap-nhat.json
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.7 (must already be pushed)"
        required: true
      notes:
        description: "What changed (empty = the Windows release's notes)"
        required: false
        default: ""

env:
  CHANNEL: https://hirlogin-cap-nhat.hir-contact-vn.workers.dev
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build and sign (app + dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app,dmg

      # Without a signature on the whole app, a Mac that downloads it reports "Hir-Login is damaged
      # and can't be opened". The app is signed ad hoc by the build ("signingIdentity": "-"); this
      # checks that it really is — the app, the copy inside the dmg and the update archive — and
      # stops here, before anything is published, when it is not.
      - name: Check the app is signed
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Hir-Login.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$APP/Contents/_CodeSignature/CodeResources"
          codesign -dv "$APP" 2>&1 | head -12
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          codesign --verify --deep --strict --verbose=2 "$MNT/Hir-Login.app"
          hdiutil detach "$MNT" -quiet
          TMP=$(mktemp -d)
          tar -xzf src-tauri/target/release/bundle/macos/Hir-Login.app.tar.gz -C "$TMP"
          codesign --verify --deep --strict --verbose=2 "$TMP/Hir-Login.app"
          echo "signed: app, dmg and update archive"

      - name: Publish to the Mac channel
        env:
          UPLOAD_KEY: ${{ secrets.HIRLOGIN_UPLOAD_KEY }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG is version $VERSION"; exit 1; }
          # No notes given: reuse the Windows release's, when it is this same version.
          if [ -z "${NOTES:-}" ]; then
            NOTES=$(curl -sf "$CHANNEL/windows/x86_64/latest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.version===process.argv[1]?(j.notes||""):"")}catch{}})' "$VERSION" || true)
          fi
          export NOTES
          TGZ="src-tauri/target/release/bundle/macos/Hir-Login.app.tar.gz"
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          TGZ_NAME="Hir-Login_${VERSION}_aarch64.app.tar.gz"
          DMG_NAME="Hir-Login_${VERSION}_aarch64.dmg"
          export VERSION TGZ TGZ_NAME DMG_NAME
          for f in "$TGZ" "$DMG"; do
            SIZE=$(stat -f%z "$f"); [ "$SIZE" -lt 26214400 ] || { echo "$f is over 25 MB (KV limit)"; exit 1; }
          done
          put() { curl -sf -X PUT "$CHANNEL/upload/$1" -H "x-upload-key: $UPLOAD_KEY" -H "content-type: $2" --data-binary "@$3"; echo; }
          # Files first, then the manifest that points at them.
          put "file:$TGZ_NAME" application/gzip "$TGZ"
          put "file:$DMG_NAME" application/x-apple-diskimage "$DMG"
          node -e '
            const fs = require("fs");
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: process.env.NOTES || "",
              pub_date: new Date().toISOString(),
              url: process.env.CHANNEL + "/file/" + process.env.TGZ_NAME,
              signature: fs.readFileSync(process.env.TGZ + ".sig", "utf8").trim(),
            }));
            fs.writeFileSync("tai.txt", process.env.CHANNEL + "/file/" + process.env.DMG_NAME);
          '
          put "latest:darwin-aarch64" application/json latest.json
          put "tai:mac" text/plain tai.txt
          curl -sf "$CHANNEL/darwin/aarch64/latest.json?t=$(date +%s)"
